[project]
name = "cc-preflight"
version = "0.0.0"
description = "Preflight watches your AI agents, catches expensive or wrong actions before they happen, proves the decision, and measures waste."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sid" }]
keywords = ["ai", "agents", "audit", "security", "observability", "llm"]
dependencies = [
    "typer==0.15.1",
    "rich==13.9.4",
    "pydantic==2.10.4",
    # Declarative policy-as-code (Phase 4). Loaded with yaml.safe_load only — no
    # arbitrary object construction, no eval/exec (S7).
    "pyyaml==6.0.2",
]

[project.scripts]
preflight = "preflight.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]
# Optional: only needed for the opt-in live judge (`preflight demo --live`).
# Deliberately NOT a core dependency and NOT installed in CI — keeps the default
# install network-free (S2) and tests free/deterministic.
judge = [
    "anthropic>=0.40,<1.0",
    "google-genai>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) is fine in tests; that's handled per-file below.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Typer's API requires calling typer.Option/Argument in parameter defaults.
"src/preflight/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
